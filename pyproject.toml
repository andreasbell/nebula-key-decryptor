[project]
name = "nebula-key-decryptor"
version = "0.1.0"
description = "CLI tool for encrypting and decrypting nebula private keys"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "protobuf>=7.35.1",
]

[project.scripts]
nebula-key-decryptor = "nebula_key_decryptor.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
